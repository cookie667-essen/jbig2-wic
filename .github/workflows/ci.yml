name: Build Windows x64

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/Release/jbig2_wic.dll dist/
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath jbig2-wic-win64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jbig2-wic-win64
          path: jbig2-wic-win64.zip
