name: Build & Release Windows x64

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run Automated Codec Self-Test
        run: python tests/ci_selftest.py

      - name: Package Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/Release/jbig2_wic.dll dist/
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath jbig2-wic-win64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jbig2-wic-win64
          path: jbig2-wic-win64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag jbig2-wic-win64.zip --clobber
          } else {
            gh release create $tag jbig2-wic-win64.zip --title "JBIG2-WIC $tag" --generate-notes
          }
