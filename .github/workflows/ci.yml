name: Build & Release (Windows & Linux x64)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Ensure Pillow
        run: python -c "import PIL" 2>$null || python -m pip install --quiet pillow

      - name: Run Automated Codec Self-Test
        run: python tests/ci_selftest.py

      - name: Package Windows Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/Release/jbig2_wic.dll, build/Release/jbig2-cli.exe dist/
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath jbig2-tools-win64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jbig2-tools-win64
          path: jbig2-tools-win64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-pil

      - name: Configure & Build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run Automated Codec Self-Test
        run: JBIG2_BUILD_DIR=build python3 tests/ci_selftest.py

      - name: Package Linux Release Tarball
        run: |
          mkdir -p dist
          cp build/libjbig2.so build/jbig2-cli dist/
          cp linux/jbig2.thumbnailer linux/jbig2-mime.xml linux/install-linux.sh dist/
          cp LICENSE README.md dist/
          chmod +x dist/jbig2-cli dist/install-linux.sh
          tar -czf jbig2-tools-linux-x64.tar.gz -C dist .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jbig2-tools-linux-x64
          path: jbig2-tools-linux-x64.tar.gz

  release:
    needs: [ build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Assets
        uses: actions/download-artifact@v6
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release_assets/* --repo "$REPO" --title "jbig2-tools $TAG" --generate-notes
          fi
